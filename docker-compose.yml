services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      reid:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_STORE_PATH: /app/data/app-store.json
      REID_DETECTIONS_URL: http://reid:8890/detections
      REID_BACKEND_FETCH_MS: ${REID_BACKEND_FETCH_MS:-180000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - web_data:/app/data

  reid:
    build:
      context: .
      dockerfile: backend/reid_service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REID_BIND_HOST: 0.0.0.0
      REID_BIND_PORT: 8890
      REID_EMBED_BACKEND: ${REID_EMBED_BACKEND:-torchreid}
      TORCHREID_MODEL: ${TORCHREID_MODEL:-osnet_ain_x1_0}
      TORCHREID_WEIGHTS: ${TORCHREID_WEIGHTS:-/app/backend/reid_service/weights/osnet_ain_x1_0_msmt17_combineall.pth.tar}
      TORCHREID_DEVICE: ${TORCHREID_DEVICE:-cpu}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_CONF: ${YOLO_CONF:-0.08}
      YOLO_IMGSZ: ${YOLO_IMGSZ:-960}
      YOLO_MAX_SIDE: ${YOLO_MAX_SIDE:-1280}
      YOLO_KEEP_MIN_CONF: ${YOLO_KEEP_MIN_CONF:-0.15}
      CROP_MIN_SIDE: ${CROP_MIN_SIDE:-40}
      CROP_MIN_SIDE_FOR_NEW: ${CROP_MIN_SIDE_FOR_NEW:-80}
      CROP_PAD: ${CROP_PAD:-0.30}
      REID_MATCH_THRESHOLD: ${REID_MATCH_THRESHOLD:-0.48}
      REID_PER_CAMERA_TRACK: ${REID_PER_CAMERA_TRACK:-1}
      REID_GLOBAL_MATCH_ORDER: ${REID_GLOBAL_MATCH_ORDER:-0}
      REID_USE_COLOR_FEATURES: ${REID_USE_COLOR_FEATURES:-1}
      REID_USE_POSE: ${REID_USE_POSE:-1}
      DETECTIONS_STATS: ${DETECTIONS_STATS:-1}
    ports:
      - "${REID_PORT:-8890}:8890"

volumes:
  web_data:
